name: Research preview checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-preview.txt
      - name: Install core build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libeigen3-dev libgtest-dev
      - name: Install portable tool dependencies
        run: python -m pip install -r requirements-preview.txt
      - name: Build, test, activate synthetic GNSS and recompute ATE
        run: bash scripts/check_preview.sh
      - name: Retain test reports and generated synthetic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-reports
          path: build_preview/reports
          if-no-files-found: ignore
