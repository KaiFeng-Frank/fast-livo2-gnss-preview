# M3DGR, Livox MID-360 + MID-360 IMU + D435i colour camera (AMENDMENTS A76: host LiDAR identification).
# LIVO parameters = the official baseline baseline_systems/Fast_LIVO2_M3DGR/src/fast_livo2/config/m3dgr_mid360.yaml
# (sjtuyinjie/M3DGR, file blob 347476bc, sha256 2b45dbee..., last changed in commit e87e273 of 2025-07-24; shared by every
# arm, never tuned). Which keys are the official file's and which are this repository's:
#   official, host-specific : common/lid_topic, common/imu_topic, extrin_calib/{extrinsic_T,extrinsic_R,Rcl,Pcl},
#                             preprocess/scan_line (4; the MID-360 has four lines, line = 0..3)
#   official, shared with the Avia file (identical values): everything else from `common` to `pcd_save`
#   this repository ("ref-R", same keys and values as config/m3dgr_avia.yaml): common/img_compressed, imu/turnon_prior_en,
#                             publish/use_sensor_time, evo/{seq_name,pose_output_en}, and the replay / output / debug /
#                             gnss trees at the end
#   gnss tree: identical to config/m3dgr_avia.yaml except gnss/frames/lever_arm_xyz (9Ps antenna in the MID-360 LiDAR
#                             frame; A77: from the host's own development-set fit and the chain's rotation, see the key),
#                             gnss/imu_bridge (MID-360 IMU; derived by tools/m3dgr_calib.py --lidar mid360) and
#                             gnss/process/frame (the registration random walk of this host, A78: same program, this host's runs)
# The official file keeps `lidar_type: 1` (the Livox CustomMsg handler of FAST-LIVO2, named "Avia" in its comment): the
# MID-360 bag topic /livox/mid360/lidar carries livox_ros_driver2/CustomMsg with the same md5 (e4d6829b...) as the
# livox_ros_driver CustomMsg this build decodes, and rosbag matches by md5. No source change (A76 implementation record).
# Mid-360 specifics measured on the bag (format level, A76): IMU linear_acceleration is in g (|a| = 0.998), not m/s^2 like
# the Avia IMU; FAST-LIVO2 rescales by G/|mean acc| at initialisation, so the units do not matter to the host or to the bridge.
common:
  img_topic: "/camera/color/image_raw"
  lid_topic: "/livox/mid360/lidar"
  imu_topic: "/livox/mid360/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false
  img_compressed: true          # ref-R: subscribe/replay /camera/color/image_raw/compressed and decode in-process (DESIGN §13)

extrin_calib:
  extrinsic_T: [ -0.011, -0.02329, 0.04412 ]     # calibration.md 1.6 mid360 -> mid360_imu (T_{I<-L}), same as the official file
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  # LidarToCamera 
  Rcl: [0.0722207,  -0.997387, -0.0020542,       # calibration.md 1.4 mid360 -> camera (T_{C<-L}), same as the official file
        0.521005,   0.039482,  -0.85264,
        0.850493,  0.060508,   0.522494] 
  Pcl: [-0.0442358, -0.411712, 0.168568]

time_offset: 
  imu_time_offset: 0.0
  img_time_offset: 0.1
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 1 # Livox CustomMsg handler (the official file's comment says Avia; it also serves the MID-360)
  scan_line: 4
  blind: 0.8

vio:
  max_iterations: 5
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  img_point_cov: 100 # 100 1000 
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  # Host b_a/g init covariance from the BMI088 zero-g offset and package alignment: the BMI088 belongs to the Avia, not to
  # the MID-360 IMU, so this stays false here (upstream 1e-5, U stays the FAST-LIVO2 baseline).
  turnon_prior_en: false
  acc_cov: 0.5 # 0.2
  gyr_cov: 0.3 # 0.5
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025 # 0.005
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:  
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: true
  pub_effect_point_en: false 
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0
  use_sensor_time: true         # ref-R: odometry/path/mavros stamped with t_k instead of the wall clock (DESIGN §14)

evo:
  seq_name: "m3dgr"             # ref-R: overridden per run by the replay launch (arg seq)
  pose_output_en: true          # ref-R: upstream evo file Log/result/<seq_name>.txt is a zero-channel gate input (DESIGN §13)

pcd_save:
  pcd_save_en: false
  colmap_output_en: false # need to set interval = -1
  filter_size_pcd: 0.15
  interval: -1
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

# ---- ref-R additions (DESIGN §14) ----
replay:
  enable: false                 # true only inside fastlivo_replay (set by the launch); the live node keeps its subscriptions
  bag: ""
  start_offset_s: 0.0
  duration_s: -1.0
  order: record
  img_jitter_s: 0.0
  seed: 0

output:
  dir: ""                       # "" = no writer files; set per run
  traj_w: true
  traj_n: true
  state_trace: true
  global_cloud: false
  timing: true

debug:
  cov_csv: true

# ---- GNSS tight coupling (P3; DESIGN §14 as amended). Every key is a field of livo_gnss::Config (gnss/include/livo_gnss/
# config.hpp); the ROS glue refuses unknown keys and wrong types. Arms are overlays loaded after this file
# (config/arms/*.yaml, AMENDMENTS A46). Per sequence the run script injects the data inputs:
#   gnss/nav_rinex      the day's IGS BRDC file (fastlivo_replay --nav-rinex; A1/A38/A45: required with gnss_comm_ros1)
#   gnss/time/calib_file the sequence's time calibration (tools/time_calib, A18)
# Starred values (DESIGN §14 *), the L0 C/N0 masks and the receiver-std guards are the closed-form development-set
# calibration of TEST_PLAN §3 (AMENDMENTS A58, P4; tools/calib); the tree is frozen with its sha256 in A58.
gnss:
  enable: false                 # false = zero channel: bit-identical to ref-R (U arm)
  update_enable: true           # false = OBSERVE (bypass gate)
  mode: tight                   # tight | loose_pvt | livgo_probe | livgo_probe_norej
  update_slot: pre_lio          # pre_lio | post_vio (I13 only, A12)
  use: {psr: true, dopp: true, tdcp: true, pvt_vel: true}
  source: gnss_comm_ros1        # gnss_comm_ros1 | rinex | ubx_stream
  topics:
    meas: /ublox_driver/range_meas
    ephem: /ublox_driver/ephem
    glo_ephem: /ublox_driver/glo_ephem
    iono: /ublox_driver/iono_params           # diagnostics only (A38: not GPS Klobuchar)
    pvt: /ublox_driver/receiver_pvt
    tp: /ublox_driver/time_pulse_info         # counted only (A19)
  rinex: {obs: "", nav: "", latency_s: 0.0}
  nav_rinex: []                 # injected per sequence (see above)
  systems: {gps: true, glo: true, gal: true, bds: true, qzs_as_gps: true, glo_psr: false, bds_geo: {use: true, psr_scale: 2.0}}
  exclude_sats: []
  frames:
    lever_arm_frame: lidar
    lever_arm_xyz: [-0.1332496693, -0.01051226054, -0.1686119725]   # 9Ps antenna in the MID-360 frame (A77), l^I = R_IL l + t_IL =
                                              # [-0.1442496693, -0.03380226054, -0.1244919725]. NOT the calibration.md chain's value
                                              # ([-0.2735022446, 0.0240866806, -0.2552467974]: its avia -> mid360 translation disagrees with the
                                              # data by 0.15-0.17 m along the heading, A76 record section six). Instead: the C-RTK 2HP (ground-truth)
                                              # antenna's lever fitted on this host's own Grass01/Grass02 U runs (tools/calib/host_gt_lever.py,
                                              # level frame (-0.049, -0.152), vertical -0.0297 from the chain: l^I_gt = [-0.01999096558,
                                              # -0.1534376595, -0.04942328067]) plus the 9Ps - 2HP offset in the vehicle axes (A15 9Ps lever
                                              # [-0.31635, 0.10926, 0.4006] minus A58 2HP lever [-0.176, -0.016, 0.401], vertical 0 = same
                                              # height: (-0.14035, 0.12526, 0)) carried by the chain's ROTATION only (avia -> mid360), then
                                              # the LiDAR -> IMU translation of extrinsic_T taken off (l^L = l^I - t_IL, extrinsic_R = I)
    lever_arm_sigma: 0.03
    pivot_distance_m: 100.0
    sigma_dov_rad: 1.5e-4
    # Optional. 0 keeps the A61 prior. The BMI088 candidate hypot(atan(20 mg), 0.5 deg) = 0.021824
    # was not adopted: see U15 LevelingBiasGateAndPrior.
    sigma_lev_rad: 0.0
    gnss_updates_gravity: true
  time:
    base: host                  # M3DGR: GnssMeasMsg has no header; the estimator runs on the host-stamped sensors
    leap: auto
    offset_s: 0.0               # the sequence's calib_file overrides offset/drift/sigma (A18)
    drift_ppm: 0.0
    t_ref_gpst_s: 0.0
    calib_file: ""              # injected per sequence (see above)
    sigma_toff_s: 0.05
    estimate_online: false
    td_rw_s2_per_s: 1.0e-8
    max_bridge_s: 0.3
    bridge_ring_cycles: 4
    toff_monitor: {enable: true, window_s: 30.0, min_abs_s: 0.005, n_sigma: 3.0}
  imu_bridge: {acc_n: 0.0115, gyr_n: 0.00133}  # MID-360 IMU (M3DGR Kalibr 3.2 avg-axis 1.147e-2, 1.325e-3; A15 default comment)
  masks:
    el_deg: 10.0
    cn0_psr: 20.0               # A58 (P4 calibration): change points of the >4-sigma tail rate over C/N0 (pseudorange,
    cn0_dopp: 12.0              # Doppler); carrier: the lowest C/N0 with TDCP rows on the development set (no tail rise)
    cn0_cp: 25.0
    track_psr: 10
    track_cp: 3
    eph_age_s: {G: 7200.0, E: 7200.0, C: 3600.0, R: 1800.0, J: 7200.0}
    max_psr_std_m: 41.0         # A58: no tail change point over the receiver std above the C/N0 masks, so the std masks
    max_dopp_std_hz: 16.4       # stay gross-error guards above the largest value on the development set (40.96 m, 16.384 Hz)
    max_cp_std_m: 0.02
    psr_min_m: 1.9e+7
    psr_max_m: 4.5e+7
    max_range_rate_mps: 2000.0
  noise:
    psr: {sigma0_m: 0.773, cn0_ref: 45.0, k_std: 0.0, tau_s: 33.1, decim_s: 1.0, err_brdci: 0.5,
          sys_factor: {G: 1.0, E: 1.0, C: 1.0, R: 1.5, J: 1.0}}
    dopp: {sigma0_mps: 0.127, tau_s: 0.047, exclusive_with_tdcp: true}
    tdcp: {sigma0_m: 0.004, interval_s: 0.5, sigma_rate_mps: 0.002, sigma_windup_m: 0.002, max_span_s: 1.5}
    pvt: {tau_pos_s: 21.6, tau_vel_s: 0.52, decim_s: 1.0, scale: 0.35}
    scale: {psr: 0.0178, dopp: 0.2118, tdcp: 0.882}
  process:
    clock: {S_b: 1.0e-3, S_d: 1.43e-2, S_b_min_windup: true}
    isb_q: 1.0e-4
    # Registration random walk of the MID-360 host (A78 implementation record, part 1). These five describe the host's own drift, so they are
    # this host's, not the Avia's (A58 horizontal from five Avia sequences, A70 vertical): the same closed-form program (tools/calib/p4_calib.py
    # frame: U-arm traj_W antenna track against the audited GT; segments {10,20,50,100,200} m, first 10 % aligned in translation and yaw;
    # robust variances; NNLS with end-point constants; lateral set split by accumulated turn; 75 % quantile over the trajectories) on the
    # development set only: Grass01, Grass02, Z-Rough-Road01 x five seeds = the 15 MID-360 U runs a76-mid-dev-{g1,g2,zrr}u0..4, 2026-10-02.
    # GT antenna lever held at tools/eval/lidars.json mid360 gt_lever_imu (A77, --lever-fixed); turn measure = rotation about the vertical
    # (--alpha vertical: the MID-360 IMU is tilted 31.8 degrees, the A58 heading-of-the-IMU-x-axis proxy picks up the roll; on the level Avia
    # IMU the two agree to <1 %). Units: q_tilt, q_yaw_per_m rad^2/m; q_yaw_per_rad rad^2/rad; q_th, q_tv m^2/m. q_tilt is exactly 0: all
    # 15 per-trajectory fits are 0 (the vertical error of this host does not grow faster than linearly with path length).
    # Result file: runs/a78-score/mid360/frame_mid360_dev3x5_vertical.json (remote), AMENDMENTS A78 implementation record, part 1.
    frame: {q_tilt_per_m: 0.0, q_yaw_per_m: 1.4836455387643271e-07, q_yaw_per_rad: 5.0682795400455866e-07, q_th_per_m: 9.1154744128326817e-05, q_tv_per_m: 0.00019090891586508499, q_time: 0.0}
  init: {min_livo_frames: 50, min_sats: 5, max_gdop: 5.0, min_epochs: 30, min_window_s: 10.0, min_hspeed_mps: 0.5,
         min_moving_epochs: 30, min_path_m: 5.0, yaw_sigma_max_deg: 3.0, spp_sigma_floor_m: 3.0, nlos_cn0_margin_db: 8.0}
  rejection: {alpha_w: 1.0e-3, alpha_nis: 1.0e-3, max_reject_frac: 0.5, min_meas: {psr: 1, dopp: 1, tdcp: 2},
              post_check: true, core_step_max_m: 0.05, clock_jump_km: 1.0, lockout_epochs: 20}
  slip: {lli: true, half_cycle: true, max_gap_s: 1.5, dopp_tol_cyc: 0.5, jerk_max: 1.0, innov_abs_m: 0.05, gf_tol_m: 0.05}
  integrity:
    velocity_alarm: {enable: true, alpha: 1.0e-3, min_err_mps: 0.2, n_consec: 5, n_clear: 10}
    heading: {enable: true, min_speed: 0.5, n_consec: 20, min_err_deg: 5.0}
    degeneracy: {lambda_enter: 400.0, lambda_exit: 800.0, window: 10, floor_enable: false, sigma_floor_m: 0.05}
  iterate: {yaw_sigma_deg: 2.0, dyaw_deg: 0.1, max_iter: 3, reacq_epochs: 5}
  outage: {outage_s: 1.0, recover_min_sats: 4, recover_settle_s: 1.0, reinit_after_s: 60.0, reinit_sigma_t_m: 10.0, reinit_sigma_psi_rad: 0.1}
  ablation: {frame_fixed_after_init: false, tdcp_fixed_anchor: false, disable_l4_l5: false}
  output: {frame_id: enu, smooth_trans_mps: 0.2, smooth_yaw_dps: 2.0, sat_csv: false}
  ephem:
    ura_semantics: metres       # A16/A45: judged by the ingest audit (E4) on Grass01/02, Dark01, Outdoor01
    gal_prefer_inav: true
