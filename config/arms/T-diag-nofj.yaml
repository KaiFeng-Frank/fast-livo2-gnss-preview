# Diagnostic arm T-diag-nofj (AMENDMENTS A62; development set only, not an evaluation arm): arm T-diag with the A61 F9
# map-frame-jump detector switched off, everything else as T-diag (A58 frozen configuration + A61 code defaults). It is
# the counterfactual of the A62 review: FRAME_JUMP fired on ordinary LIO corrections on the development set.
gnss:
  enable: true
  update_enable: true
  mode: tight
  update_slot: pre_lio
  use: {psr: true, dopp: true, tdcp: true, pvt_vel: true}
  output: {sat_csv: true}
  integrity: {frame_jump: {enable: false}}
