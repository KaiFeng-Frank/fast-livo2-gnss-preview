# LIVGO-v2 with the paper's row strength (AMENDMENTS A75 section 6.6), calibration arm, not an evaluation arm.
# Identical to LIVGO-v2.yaml except the row noise: every Doppler row has sigma_D = 0.05 m/s and every TDCP row sigma_TDCP =
# 1 mm, fixed, plus only the IMU-bridge terms that no state carries (TDCP: u1' M Sigma_D M' u1 and its cross terms; Doppler:
# acc_n^2 delta, the gyro noise through the lever arm, S_d delta). No elevation, C/N0, receiver-std, kappa_AR, noise.scale or
# sigma_toff dependence; the RAIM, DTW and initialisation models are untouched. Masks (el 15 deg, C/N0 A58 20/12/25), RAIM,
# chi-square alpha 1e-3 as in LIVGO-v2. lambda_th 1017833.912 as there (calibrated once on the LIVGO-v2
# collection runs, see LIVGO-v2.yaml).
gnss:
  enable: true
  update_enable: true
  mode: tight
  update_slot: post_vio
  use: {psr: false, dopp: true, tdcp: true, pvt_vel: false}
  masks: {el_deg: 15.0}
  init: {yaw_sigma_max_deg: 0.5}
  noise:
    dopp: {project_tilt: false, consider_tilt: false, exclusive_with_tdcp: false}
    tdcp: {interval_s: 0.1, max_span_s: 0.15, chain_pairs: true, phase_states: true}
  ablation: {frame_fixed_after_init: true, tdcp_fixed_anchor: true, disable_l4_l5: false}
  livgo: {enable: true, paper_init: false, frame_exact: true, lambda_source: lio, dtw_online: false, lambda_th: 1017833.912,
          noise_mode: flat, flat_sigma_tdcp_m: 0.001, flat_sigma_dopp_mps: 0.05,
          tdcp_gain_log: true}
